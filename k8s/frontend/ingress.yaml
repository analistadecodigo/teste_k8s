apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-manager-frontend
  namespace: finance-manager
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: finance-manager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-manager-frontend
                port:
                  number: 80