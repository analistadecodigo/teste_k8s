apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-manager-backend
  namespace: finance-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-manager-backend
  template:
    metadata:
      labels:
        app: finance-manager-backend
    spec:
      containers:
        - name: backend
          image: valdir713/finance-manager-backend:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
